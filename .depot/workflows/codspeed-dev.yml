name: benchmarks

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - "main"
  pull_request:

env:
  CODSPEED_LOG: debug

jobs:
  benchmarks:
    permissions:
      contents: read
      id-token: write
    strategy:
      # Keep walltime and simulation jobs independent: a failing or timed-out
      # simulation shard must not cancel the in-progress walltime jobs.
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-latest
          #  - codspeed-macro-codspeed-francois-dev
          - codspeed-macro
        shard:
          - 1
          - 2
        runner-version:
          - 'latest'

    name: 'Run Benchmarks'
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.5"
      - run: pip install -r requirements.txt

      - name: Run the action
        uses: CodSpeedHQ/action@v5
        with:
          # Multithread/multiprocess benchmarks (marked `walltime_only`) are
          # deselected in simulation runs: instrumentation cannot accurately
          # measure parallel workloads, so they only run in walltime mode.
          run: pytest tests/ --codspeed ${{ matrix.runs-on == 'ubuntu-latest' && '-m "not walltime_only"' || '' }} --test-group=${{ matrix.shard }} --test-group-count=2
          mode: ${{ matrix.runs-on == 'ubuntu-latest' && 'simulation' || 'walltime,memory' }}
          upload-url: ${{ secrets.CODSPEED_DEV_UPLOAD_URL }}/upload
          # token: ${{ secrets.CODSPEED_DEV_TOKEN }}
          runner-version: ${{ matrix.runner-version }}
          exclude-allocations: "false"

